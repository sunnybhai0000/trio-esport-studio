<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TRIO ESPORT STUDIO — Tournament Location</title>

  <link rel="icon" type="image/png" href="assets/logo.png">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      padding: 25px 15px 100px;

      font-family: Arial, sans-serif;
      color: white;

      /* BACKGROUND IMAGE - CHANGE ONLY IF NEEDED */
      background:
        linear-gradient(
          rgba(2, 5, 10, 0.82),
          rgba(2, 5, 10, 0.94)
        ),
        url("assets/hero.png")
        center / cover fixed no-repeat;
    }

    .page {
      width: 100%;
      max-width: 560px;
      margin: auto;
    }


    /* =========================
       LOGO
    ========================= */

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo img {
      width: 75px;
      height: 75px;
      object-fit: contain;
    }


    /* =========================
       PAGE TITLE
    ========================= */

    .heading {
      text-align: center;
      margin-bottom: 25px;
    }

    .heading small {
      display: block;

      margin-bottom: 7px;

      color: #ff8a00;

      font-size: 10px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .heading h1 {
      font-size: 38px;
      line-height: 1.1;
      font-weight: 900;
    }

    .heading h1 span {
      color: #159cff;
    }


    /* =========================
       VENUE BOX
    ========================= */

    .venue-box {
      padding: 22px 18px;

      background: rgba(5, 9, 16, 0.75);

      border: 1px solid rgba(21, 156, 255, 0.3);
      border-radius: 14px;

      backdrop-filter: blur(7px);
    }

    .label {
      margin-bottom: 7px;

      color: #748196;

      font-size: 9px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .venue {
      font-size: 22px;
      line-height: 1.3;
      font-weight: 900;
    }

    .city {
      margin-top: 5px;

      color: #ff8a00;

      font-size: 13px;
      font-weight: bold;
    }


    /* =========================
       DATE + TIME
    ========================= */

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 10px;

      margin-top: 18px;
    }

    .detail {
      padding: 14px;

      background: rgba(255, 255, 255, 0.04);

      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 9px;
    }

    .detail-value {
      font-size: 13px;
      font-weight: bold;
      line-height: 1.4;
    }


    /* =========================
       GAMES + MODES
    ========================= */

    .section {
      margin-top: 18px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .tag {
      padding: 8px 11px;

      color: #dff3ff;

      background: rgba(21, 156, 255, 0.08);

      border: 1px solid rgba(21, 156, 255, 0.25);
      border-radius: 6px;

      font-size: 10px;
      font-weight: bold;
    }

    .tag.orange {
      color: #ffe0bc;

      background: rgba(255, 138, 0, 0.07);

      border-color: rgba(255, 138, 0, 0.25);
    }


    /* =========================
       INSTRUCTION
    ========================= */

    .instruction {
      margin-top: 22px;

      color: #9da8b7;

      font-size: 11px;
      line-height: 1.6;
    }


    /* =========================
       STICKY BOTTOM BUTTONS
    ========================= */

    .bottom-bar {
      position: fixed;

      left: 50%;
      bottom: 12px;

      z-index: 100;

      width: calc(100% - 24px);
      max-width: 530px;

      transform: translateX(-50%);

      display: grid;
      grid-template-columns: 1fr 1fr 1fr;

      gap: 7px;

      padding: 7px;

      background: rgba(5, 8, 13, 0.92);

      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;

      backdrop-filter: blur(12px);
    }

    .bottom-btn {
      min-height: 48px;

      display: flex;

      align-items: center;
      justify-content: center;

      gap: 6px;

      color: white;

      text-decoration: none;

      border-radius: 8px;

      font-size: 9px;
      font-weight: bold;
    }

    .whatsapp {
      background: #128c45;
    }

    .instagram {
      background: #b62972;
    }

    .location {
      background: #087ee8;
    }

    .bottom-btn svg {
      width: 18px;
      height: 18px;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 430px) {

      .heading h1 {
        font-size: 30px;
      }

      .venue {
        font-size: 19px;
      }

      .bottom-btn {
        min-height: 46px;
        font-size: 8px;
      }

    }

  </style>

</head>


<body>


  <main class="page">


    <!-- =========================
         LOGO
         CHANGE LOGO HERE IF NEEDED
    ========================== -->

    <div class="logo">

      <img
        src="assets/logo.png"
        alt="TRIO ESPORT STUDIO"
      >

    </div>


    <!-- =========================
         PAGE TITLE
    ========================== -->

    <section class="heading">

      <small>
        TRIO ESPORT STUDIO
      </small>

      <h1>
        TOURNAMENT
        <span>LOCATION</span>
      </h1>

    </section>


    <!-- =========================
         VENUE + DETAILS
    ========================== -->

    <section class="venue-box">


      <!-- EDIT VENUE HERE -->

      <div class="label">
        Venue
      </div>

      <div class="venue">
        Bodhegaon, Bajar Tal (Market Yard)
      </div>


      <!-- EDIT CITY HERE -->

      <div class="city">
        Bodhegaon
      </div>


      <!-- DATE + TIME -->

      <div class="details">


        <!-- EDIT DATE HERE -->

        <div class="detail">

          <div class="label">
            Date
          </div>

          <div class="detail-value">
            28 October – 30 October
          </div>

        </div>


        <!-- EDIT TIME HERE -->

        <div class="detail">

          <div class="label">
            Time
          </div>

          <div class="detail-value">
            4:00 PM – 11:00 PM
          </div>

        </div>


      </div>


      <!-- =========================
           EDIT GAMES HERE
      ========================== -->

      <div class="section">

        <div class="label">
          Games
        </div>

        <div class="tags">

          <span class="tag">
            FREE FIRE
          </span>

          <span class="tag">
            PUBG
          </span>

        </div>

      </div>


      <!-- =========================
           EDIT MODES HERE
      ========================== -->

      <div class="section">

        <div class="label">
          Modes
        </div>

        <div class="tags">

          <span class="tag orange">
            SOLO
          </span>

          <span class="tag orange">
            DUO
          </span>

          <span class="tag orange">
            SQUAD
          </span>

        </div>

      </div>


      <!-- =========================
           EDIT INFORMATION HERE
      ========================== -->

      <p class="instruction">

        Tournament se related important information
        yahan update ki jayegi.

      </p>


    </section>


  </main>


  <!-- =====================================================
       STICKY BOTTOM BUTTONS
  ====================================================== -->

  <nav class="bottom-bar">


    <!-- =========================
         WHATSAPP
         NUMBER IS SET BELOW
    ========================== -->

    <a
      class="bottom-btn whatsapp"
      id="whatsapp"
      href="#"
      target="_blank"
      rel="noopener"
    >

      <!-- WhatsApp Icon -->

      <svg
        viewBox="0 0 24 24"
        fill="currentColor"
      >

        <path d="M20.52 3.48A11.87 11.87 0 0 0 12.08 0C5.52 0 .18 5.34.18 11.9c0 2.1.55 4.15 1.6 5.96L.1 24l6.28-1.65a11.88 11.88 0 0 0 5.7 1.45h.01c6.56 0 11.9-5.34 11.9-11.9 0-3.18-1.24-6.17-3.47-8.42ZM12.09 21.8h-.01a9.88 9.88 0 0 1-5.03-1.38l-.36-.21-3.73.98.99-3.64-.23-.37a9.86 9.86 0 0 1-1.51-5.28c0-5.45 4.44-9.89 9.9-9.89 2.64 0 5.12 1.03 6.98 2.9a9.82 9.82 0 0 1 2.89 7c0 5.45-4.44 9.89-9.89 9.89Zm5.43-7.4c-.3-.15-1.77-.87-2.05-.97-.28-.1-.48-.15-.68.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.46-.88-.78-1.48-1.74-1.65-2.04-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.68-1.63-.93-2.23-.24-.58-.49-.5-.68-.51h-.58c-.2 0-.52.07-.8.37-.28.3-1.05 1.03-1.05 2.51s1.08 2.91 1.23 3.11c.15.2 2.12 3.24 5.14 4.54.72.31 1.28.49 1.72.63.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.12-.27-.2-.57-.35Z"/>

      </svg>

      WHATSAPP

    </a>


    <!-- =========================
         INSTAGRAM
         LINK IS SET BELOW
    ========================== -->

    <a
      class="bottom-btn instagram"
      id="instagram"
      href="#"
      target="_blank"
      rel="noopener"
    >

      <!-- Instagram Icon -->

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <rect
          x="3"
          y="3"
          width="18"
          height="18"
          rx="5"
        />

        <circle
          cx="12"
          cy="12"
          r="4"
        />

        <circle
          cx="17.5"
          cy="6.5"
          r="1"
          fill="currentColor"
          stroke="none"
        />

      </svg>

      INSTAGRAM

    </a>


    <!-- =========================
         LOCATION
         GOOGLE MAPS LINK IS SET BELOW
    ========================== -->

    <a
      class="bottom-btn location"
      id="maps"
      href="#"
      target="_blank"
      rel="noopener"
    >

      <!-- Location Icon -->

      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >

        <path
          d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"
        />

        <circle
          cx="12"
          cy="10"
          r="2.5"
        />

      </svg>

      LOCATION

    </a>


  </nav>


  <!-- =====================================================
       🔥 FUTURE ME SIRF YE DATA UPDATE KARNA
       BAaki code ko touch karne ki zarurat nahi.
  ====================================================== -->

  <script>

    const LOCATION_DATA = {


      /* =========================
         GOOGLE MAPS LINK
         Apna actual Google Maps
         link yaha paste karo.
      ========================== */

      mapsUrl:
        "https://maps.google.com/",


      /* =========================
         WHATSAPP NUMBER
         Country code ke saath.
         Example:
         919876543210
      ========================== */

      contact:
        "919579777738",


      /* =========================
         WHATSAPP MESSAGE
         Yaha message change kar sakte ho.
      ========================== */

      whatsappMessage:
        "Hello TRIO ESPORT STUDIO",


      /* =========================
         INSTAGRAM LINK
         Apna Instagram profile link yaha.
      ========================== */

      instagramUrl:
        "https://www.instagram.com/trio_esport_studio?utm_source=qr&rpxt=dWEzOWYxZHJrdncx"

    };


    /* =========================
       WHATSAPP BUTTON
       Isko normally touch mat karna.
    ========================== */

    const number =
      LOCATION_DATA.contact.replace(/\D/g, "");

    document.getElementById("whatsapp").href =
      "https://wa.me/919579777738/" +
      number +
      "?text=" +
      encodeURIComponent(
        LOCATION_DATA.whatsappMessage
      );


    /* =========================
       INSTAGRAM BUTTON
    ========================== */

    document.getElementById("instagram").href =
      LOCATION_DATA.instagramUrl;


    /* =========================
       LOCATION BUTTON
    ========================== */

    document.getElementById("maps").href =
      LOCATION_DATA.mapsUrl;

  </script>


</body>

</html>
